<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e99"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>برهان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
:root{--bg:#eef2f6;--pn:#fff;--ink:#14233b;--mut:#5d6b80;--line:#d5dde7;--ac:#0b6e99;--ok:#2a8a55;--bad:#c4412b;--warn:#b57400}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--pn:#16212e;--ink:#dbe6f2;--mut:#93a4ba;--line:#26354a;--ac:#5cc2f0;--ok:#5fcf93;--bad:#ff8a73;--warn:#e6b14d}}
:root[data-theme="dark"]{--bg:#0e1620;--pn:#16212e;--ink:#dbe6f2;--mut:#93a4ba;--line:#26354a;--ac:#5cc2f0;--ok:#5fcf93;--bad:#ff8a73;--warn:#e6b14d}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg) linear-gradient(var(--line) 1px,transparent 1px) 0 0/26px 26px;color:var(--ink);font:16px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--pn);border-bottom:2px solid var(--ink)}
header a.logo{font-size:24px;font-weight:700;color:var(--ink);text-decoration:none;margin-inline-end:auto}
main{max-width:820px;margin:0 auto;padding:16px 16px 80px}
h1,h2,h3{line-height:1.3}h2{margin:28px 0 10px;font-size:20px}h3{font-size:17px;margin:18px 0 6px}
.card{background:var(--pn);border:1px solid var(--line);border-inline-start:4px solid var(--ac);border-radius:4px 14px 14px 4px;padding:12px 16px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}.mut{color:var(--mut);font-size:14px}
button,.btn,select,input,textarea{font:inherit;color:var(--ink)}
button,.btn{background:var(--pn);border:1px solid var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:hover{filter:brightness(1.07)}
input,select,textarea{background:var(--pn);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:100%}
textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:15px;direction:ltr;text-align:left;min-height:110px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--ok)}
svg.g text{font:12px "Segoe UI",Tahoma,sans-serif;fill:var(--ink);text-anchor:middle;pointer-events:none}
svg.g .e{stroke:var(--line);stroke-width:2;fill:none}svg.g g{cursor:pointer}
svg.g rect{fill:var(--pn);stroke:var(--ink);stroke-width:1.5}
svg.g .lock rect{stroke:var(--line);stroke-dasharray:4}svg.g .lock text{fill:var(--mut)}
svg.g .done rect{fill:var(--ok);stroke:var(--ok)}svg.g .done text{fill:#fff}
.wd{margin:10px 0}canvas{width:100%;max-width:640px;height:auto;background:var(--pn);border:1px solid var(--line);border-radius:8px;display:block}
.sl{display:flex;gap:10px;align-items:center;direction:ltr;margin:4px 0}.sl input{flex:1}
.tp{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;direction:ltr}.tp button{font-family:ui-monospace,Consolas,monospace;padding:3px 9px}
.pv{direction:ltr;text-align:left;margin:8px 0;min-height:30px}.pv div{padding:2px 8px;border-inline-start:3px solid transparent}.pv .bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.res{padding:10px 14px;border-radius:8px;margin:10px 0;border:1px solid}.res.ok{color:var(--ok)}.res.no{color:var(--bad)}
pre{direction:ltr;text-align:left;background:var(--pn);border:1px solid var(--line);padding:10px;overflow-x:auto;border-radius:6px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:9}
.katex{font-size:1.1em}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><a class="logo" href="#/">برهان</a><a class="btn" href="#/r" id="rv"></a><a class="btn" href="#/s">إعدادات</a></header>
<main id="app"></main><div id="toast" hidden></div>
<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function H(t,a,...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(n==='html')e.innerHTML=v;else if(v!==false&&v!=null)e.setAttribute(n,v)}for(const c of k.flat())if(c!=null)e.append(c);return e}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const K='br.';let S=Object.assign({cur:{},prog:{},cards:[],cfg:{theme:'auto',lean:''}},store.get(K+'s',{}));
const save=()=>store.set(K+'s',S);
function theme(){const t=S.cfg.theme;t==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',t)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}
const tex=(t,d)=>{try{return window.katex?katex.renderToString(t,{throwOnError:false,displayMode:!!d}):'<code dir="ltr">'+esc(t)+'</code>'}catch(e){return esc(t)}};
const M=s=>String(s??'').split('$').map((p,i)=>i%2?tex(p):esc(p)).join('');
const fmt=n=>+(+n).toFixed(4);

/* ---------- LaTeX -> AST (no eval; safe for shared curricula) ---------- */
function grp(s,i){while(s[i]===' ')i++;if(s[i]!=='{')return{t:s[i],e:i+1};let d=0,j=i;for(;j<s.length;j++){if(s[j]==='{')d++;if(s[j]==='}'&&--d===0)break}return{t:s.slice(i+1,j),e:j+1}}
function lx(s){s=String(s).replace(/\\left|\\right|\\,|\\!|\\ /g,'').replace(/\\cdot|\\times/g,'*').replace(/\\pi/g,'pi').replace(/\\(sin|cos|tan|ln|sqrt|abs)/g,'$1');let m;
while((m=s.indexOf('\\frac'))>=0){const a=grp(s,m+5),b=grp(s,a.e);s=s.slice(0,m)+'(('+a.t+')/('+b.t+'))'+s.slice(b.e)}return s.replace(/\{/g,'(').replace(/\}/g,')')}
function P(src){const t=src.match(/sqrt|sin|cos|tan|ln|abs|pi|\d+\.?\d*|[a-z]|[-+*/^()=]/gi)||[];let i=0;const F=/^(sqrt|sin|cos|tan|ln|abs)$/;
const ex=()=>{let a=tm();while(t[i]==='+'||t[i]==='-'){const o=t[i++];a=[o,a,tm()]}return a};
const tm=()=>{let a=un();for(;;){const c=t[i];if(c==='*'||c==='/'){i++;a=[c,a,un()]}else if(c&&/^[\d.a-z(]/i.test(c))a=['*',a,un()];else return a}};
const un=()=>{if(t[i]==='-'){i++;return['neg',un()]}if(t[i]==='+'){i++;return un()}const a=at();if(t[i]==='^'){i++;return['^',a,un()]}return a};
const at=()=>{const c=t[i++];if(c==null)throw 0;if(c==='('){const a=ex();if(t[i++]!==')')throw 0;return a}if(/^\d/.test(c))return['n',+c];if(F.test(c))return['f',c,at()];if(c==='pi')return['n',Math.PI];if(/^[a-z]$/i.test(c))return['v',c];throw 0};
const a=ex();if(t[i]==='='){i++;const r=['=',a,ex()];if(i<t.length)throw 0;return r}if(i<t.length)throw 0;return a}
function ev(n,e){switch(n[0]){case'n':return n[1];case'v':{const v=e[n[1]];if(v==null)throw 0;return v}case'neg':return-ev(n[1],e);case'f':return Math[n[1]==='ln'?'log':n[1]](ev(n[2],e));default:{const a=ev(n[1],e),b=ev(n[2],e);return n[0]==='+'?a+b:n[0]==='-'?a-b:n[0]==='*'?a*b:n[0]==='/'?a/b:Math.pow(a,b)}}}
function rts(a,env={},R=30){const f=x=>{try{return ev(a[1],{...env,x})-ev(a[2],{...env,x})}catch(e){return NaN}};const o=[];let p=f(-R),x0=-R;
for(let x=-R+.01;x<=R;x+=.01){const c=f(x);if(isFinite(p)&&isFinite(c)&&(p===0||p*c<0)){let l=x0,h=x;for(let k=0;k<50;k++){const m=(l+h)/2;f(l)*f(m)<=0?h=m:l=m}const r=+((l+h)/2).toFixed(5);if(!o.length||Math.abs(o[o.length-1]-r)>1e-3)o.push(r)}p=c;x0=x}return o}
function sm(a,b,env={}){for(let i=0;i<10;i++){const e={...env,x:Math.random()*6-3};let u,v;try{u=ev(a,e);v=ev(b,e)}catch(_){return false}if(isFinite(u)&&isFinite(v)&&Math.abs(u-v)>1e-6*(1+Math.abs(u)))return false}return true}
function ln(n){switch(n[0]){case'n':return Number.isInteger(n[1])?'('+n[1]+':ℝ)':String(n[1]);case'v':return n[1];case'neg':return'(-'+ln(n[1])+')';case'f':return(n[1]==='sqrt'?'Real.sqrt':'Real.'+(n[1]==='ln'?'log':n[1]))+' '+ln(n[2]);case'=':return ln(n[1])+' = '+ln(n[2]);case'^':return'('+ln(n[1])+' ^ '+(n[2][0]==='n'&&Number.isInteger(n[2][1])?n[2][1]:ln(n[2]))+')';default:return'('+ln(n[1])+' '+n[0]+' '+ln(n[2])+')'}}

/* ---------- exercises ---------- */
const ri=v=>v[0]+Math.floor(Math.random()*(v[1]-v[0]+1));
function mk(ex){const env={};for(const[k,v]of Object.entries(ex.vars||{}))env[k]=Array.isArray(v)?ri(v):ev(P(lx(v)),env);
const fill=s=>String(s).replace(/\{(\+?)(\w+)\}/g,(_,p,n)=>{const v=env[n];return p?(v<0?'-'+-v:'+'+v):v});
return{ex,env,q:fill(ex.text),eq:fill(ex.eq||ex.expr),ans:Array.isArray(ex.ans)?ex.ans.map(a=>ev(P(lx(a)),env)):ex.ans}}
function rootForm(a){if(a[0]==='='&&a[1][0]==='v'&&a[1][1]==='x'){try{return ev(a[2],{})}catch(e){}}return null}
function chk(I,txt){const L=txt.split('\n').map(s=>s.trim()).filter(Boolean);if(!L.length)return{ok:false,m:'اكتب خطوة واحدة على الأقل، كل خطوة في سطر.',L};
const sol=I.ex.type==='solve';let prev=P(lx(I.eq)),got=[];
for(let i=0;i<L.length;i++){let a;try{a=P(lx(L[i]))}catch(e){return{ok:false,s:i,L,m:`تعذّر فهم الخطوة ${i+1}. راجع الأقواس والرموز.`}}
if(sol!==(a[0]==='='))return{ok:false,s:i,L,m:`الخطوة ${i+1}: ${sol?'يجب أن تكون معادلة فيها =':'يجب أن تكون تعبيرًا بلا ='}.`};
if(sol){const c=rootForm(a),pr=rts(prev);if(c!=null){if(!pr.some(r=>Math.abs(r-c)<1e-3))return{ok:false,s:i,L,m:`الخطوة ${i+1}: القيمة ${fmt(c)} ليست حلًّا للمعادلة السابقة.`};got.push(c)}
else{const r=rts(a);if(r.length!==pr.length||r.some((v,k)=>Math.abs(v-pr[k])>1e-3))return{ok:false,s:i,L,m:`الخطوة ${i+1} لا تكافئ ما قبلها: تغيّرت مجموعة الحلول (قبلها: ${pr.map(fmt).join('، ')||'—'}، وفيها: ${r.map(fmt).join('، ')||'—'}).`};prev=a}}
else{if(!sm(a,prev,I.env))return{ok:false,s:i,L,m:`الخطوة ${i+1} لا تساوي الخطوة السابقة عند تجربة قيم مختلفة لـ x.`};prev=a}}
if(sol){const miss=I.ans.filter(r=>!got.some(g=>Math.abs(g-r)<1e-3));if(miss.length)return{ok:false,L,s:L.length-1,m:`لم تصل إلى كل الحلول بصيغة x = قيمة. المفقود: ${miss.map(fmt).join('، ')}.`}}
else if(!sm(prev,P(lx(I.ans)),I.env))return{ok:false,L,s:L.length-1,m:'الناتج النهائي لا يطابق الصيغة المبسّطة المطلوبة.'};
return{ok:true,L}}
function leanOf(I,L){const sol=I.ex.type==='solve';const A=P(lx(I.eq));if(!sol){return`example (x : ℝ) : ${ln(A)} = ${ln(P(lx(L[L.length-1])))} := by\n  ring`}
let o=`example (x : ℝ) (h0 : ${ln(A)}) : ${I.ans.map(a=>'x = '+a).join(' ∨ ')} := by\n`,k=0;for(const l of L){const a=P(lx(l));if(rootForm(a)==null){k++;o+=`  have h${k} : ${ln(a)} := by nlinarith [h${k-1}]\n`}}
return o+(I.ans.length===1?`  nlinarith [h${k}]`:`  sorry -- يحتاج mul_eq_zero / rcases`)}
function rec(cid,lid,ei,ok,I){const k=[cid,lid,ei].join('|');let c=S.cards.find(x=>x.k===k);const D=864e5;
if(!ok){c?(c.iv=0,c.n=0,c.d=Date.now()):S.cards.push({k,cid,lid,ei,iv:0,n:0,d:Date.now(),tag:I.ex.trap||''})}
else{if(c){c.n++;c.iv=c.n===1?1:Math.round((c.iv||1)*2.5);c.d=Date.now()+c.iv*D;if(c.iv>30)S.cards=S.cards.filter(x=>x!==c)}
const p=S.prog[cid]=S.prog[cid]||{};p[lid]=(p[lid]||0)+1}save();badge()}
const TP=['\\frac{}{}','^{}','\\sqrt{}','\\cdot','=','(',')','x','\\pi','+','-'];
function exUI(cid,lid,ei,I,done){const ta=H('textarea',{placeholder:'اكتب خطوات الحل بصيغة LaTeX، كل خطوة في سطر\nx+2=5\nx=3',dir:'ltr',spellcheck:'false'}),pv=H('div',{class:'pv'}),res=H('div'),lw=H('div');
const draw=bad=>{pv.replaceChildren(...ta.value.split('\n').filter(s=>s.trim()).map((l,i)=>H('div',{class:i===bad?'bad':'',html:tex(l)})))};
ta.addEventListener('input',()=>draw());
const tps=H('div',{class:'tp'},TP.map(t=>H('button',{type:'button',onclick:()=>{const s=ta.selectionStart,v=ta.value;ta.value=v.slice(0,s)+t+v.slice(ta.selectionEnd);const j=t.indexOf('{');ta.focus();ta.selectionStart=ta.selectionEnd=s+(j>=0?j+1:t.length);draw()}},t)));
const go=()=>{const r=chk(I,ta.value);draw(r.s);if(r.ok){const lean=leanOf(I,r.L);rec(cid,lid,ei,true,I);res.replaceChildren(H('div',{class:'res ok'},'✓ حلّ صحيح، وكل خطوة تكافئ التي قبلها.'),H('div',{class:'row'},H('button',{class:'p',onclick:()=>done()},'مسألة جديدة'),H('button',{onclick:()=>showLean(lean)},'صيغة Lean')))}
else{rec(cid,lid,ei,false,I);res.replaceChildren(H('div',{class:'res no'},r.m,I.ex.trap?H('div',{class:'mut'},'انتبه: '+I.ex.trap):null,H('div',{class:'mut'},'حُفظ هذا الخطأ وسيعود إليك لاحقًا بأرقام جديدة.')))}};
const showLean=code=>{lw.replaceChildren(H('pre',{},code),H('div',{class:'row'},H('button',{onclick:()=>{try{navigator.clipboard.writeText(code).then(()=>toast('تم النسخ'),()=>toast('حدّد النص وانسخه'))}catch(e){toast('حدّد النص وانسخه')}}},'نسخ'),S.cfg.lean?H('button',{onclick:()=>{fetch(S.cfg.lean,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}).then(r=>r.json()).then(j=>toast(j.ok?'Lean: صحيح ✓':'Lean: '+(j.msg||'خطأ')),()=>toast('تعذّر الاتصال بخادم Lean'))}},'تحقق بـ Lean'):H('span',{class:'mut'},'أضِف عنوان خادم Lean في الإعدادات للتحقق الآلي.')))};
return H('div',{class:'card'},H('div',{html:M(I.q)}),H('div',{html:tex(I.eq,true)}),tps,ta,pv,H('div',{class:'row'},H('button',{class:'p',onclick:go},'تحقق')),res,lw)}

/* ---------- curricula ---------- */
function vc(j){if(!j||typeof j.id!=='string'||typeof j.title!=='string'||!Array.isArray(j.lessons)||!j.lessons.length)throw'ملف المنهج ينقصه id أو title أو lessons';const ids=new Set(j.lessons.map(l=>l.id));
if(ids.size!==j.lessons.length)throw'معرّفات الدروس مكرّرة';for(const l of j.lessons){l.prereqs=l.prereqs||[];if(!l.title)throw'درس بلا عنوان';for(const p of l.prereqs)if(!ids.has(p))throw'متطلب غير موجود: '+p;for(const e of l.exercises||[]){try{mk(e)}catch(x){throw'تمرين غير صالح في الدرس '+l.id}}}
const d={};const chkc=(l,s)=>{if(s.has(l.id))throw'دورة في المتطلبات';s=new Set(s).add(l.id);l.prereqs.forEach(p=>chkc(j.lessons.find(x=>x.id===p),s))};j.lessons.forEach(l=>chkc(l,new Set()));return j}
function addCur(j){vc(j);S.cur[j.id]=j;save();toast('أُضيف المنهج: '+j.title)}
const done=(cid,l)=>(S.prog[cid]?.[l.id]||0)>=3,open_=(c,l)=>l.prereqs.every(p=>done(c.id,c.lessons.find(x=>x.id===p)));
const dueN=()=>S.cards.filter(c=>c.d<=Date.now()&&S.cur[c.cid]).length;
function badge(){$('#rv').textContent='مراجعة'+(dueN()?' ('+dueN()+')':'')}

const SAMPLE={id:'sample-algebra',title:'جبر أساسي: من الحدود إلى المعادلات',subject:'رياضيات',author:'برهان',lang:'ar',lessons:[
{id:'like',title:'الحدود المتشابهة',prereqs:[],goals:['جمع الحدود التي لها المتغير نفسه'],intro:{text:'الحدّان $3x$ و $5x$ من النوع نفسه، لذلك يُجمعان كما نجمع أغراضًا متماثلة: $3x+5x=8x$. أما $3x$ و $5$ فلا يُجمعان.',widget:{type:'plot',f:'a*x+b*x',params:{a:[-3,3,1,1],b:[-3,3,2,1]}}},rules:[{name:'التجميع',tex:'ax+bx=(a+b)x'}],examples:[{q:'بسّط $2x+3x+4$',steps:['2x+3x+4','(2+3)x+4','5x+4']}],exercises:[{type:'expr',text:'بسّط التعبير:',expr:'{a}x+{b}x+{c}x',vars:{a:[2,9],b:[2,9],c:[1,9]},ans:'(a+b+c)*x',trap:'اجمع معاملات x كلها، ولا تُهمل أي حدّ.'}]},
{id:'lin1',title:'معادلة خطية',prereqs:['like'],goals:['عزل المجهول بعمليات متساوية على الطرفين'],intro:{text:'الميزان: ما تفعله في كفّة افعله في الأخرى. حلّ $ax+b=c$ هو الموضع الذي يقطع فيه الخط المستقيم $y=ax+b-c$ المحور الأفقي. حرّك المنزلقات.',widget:{type:'plot',f:'a*x+b-c',params:{a:[1,5,2,1],b:[-6,6,1,1],c:[-6,6,5,1]}}},rules:[{name:'الجمع/الطرح على الطرفين',tex:'a=b\\Rightarrow a+k=b+k'},{name:'القسمة على الطرفين',tex:'ax=c\\Rightarrow x=\\frac{c}{a}'}],examples:[{q:'حلّ $2x+3=11$',steps:['2x+3=11','2x=8','x=4']}],exercises:[{type:'solve',text:'حلّ المعادلة:',eq:'{a}x+{b}={c}',vars:{a:[2,9],k:[1,9],b:[1,9],c:'a*k+b'},ans:['k'],trap:'اطرح الثابت من الطرفين قبل القسمة، ثم اقسم الطرفين على المعامل.'}]},
