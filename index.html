body{font-size:calc(16px*var(--fs,1))}
header select{max-width:120px}
.set .row{margin:8px 0}

<header><a class="logo" href="#/" id="lg">برهان</a><select id="ls" aria-label="Language"></select><a class="btn" href="#/r" id="rv"></a><a class="btn" href="#/s" id="st"></a></header>
<main id="app"></main><div id="toast" hidden></div>
<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function H(t,a,...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(n==='html')e.innerHTML=v;else if(v!==false&&v!=null)e.setAttribute(n,v)}for(const c of k.flat())if(c!=null)e.append(c);return e}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const K='br.';const DEF={theme:'auto',lean:'',leanMode:'off',leanV:2,leanPort:8765,leanAuto:true,ui:'ar',digits:'latn',fs:100,mastery:3,voice:false,rate:1};
const _s=store.get(K+'s',{});let S=Object.assign({cur:{},prog:{},cards:[],packs:{}},_s);S.cfg=Object.assign({},DEF,_s.cfg);if(_s.cfg&&_s.cfg.lean&&!_s.cfg.leanMode)S.cfg.leanMode='custom';if(!_s.cfg||_s.cfg.leanV!==2){if(['auto','local'].includes(S.cfg.leanMode))S.cfg.leanMode='off'}
const save=()=>store.set(K+'s',S);
function theme(){const t=S.cfg.theme;t==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',t)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}
const tex=(t,d)=>{try{return window.katex?katex.renderToString(t,{throwOnError:false,displayMode:!!d}):'<code dir="ltr">'+esc(t)+'</code>'}catch(e){return esc(t)}};
const M=s=>String(s??'').split('$').map((p,i)=>i%2?tex(p):esc(p)).join('');
const fmt=n=>+(+n).toFixed(4);

/* ---------- LaTeX -> AST (no eval; safe for shared curricula) ---------- */
function grp(s,i){while(s[i]===' ')i++;if(s[i]!=='{')return{t:s[i],e:i+1};let d=0,j=i;for(;j<s.length;j++){if(s[j]==='{')d++;if(s[j]==='}'&&--d===0)break}return{t:s.slice(i+1,j),e:j+1}}
function lx(s){s=String(s).replace(/\\left|\\right|\\,|\\!|\\ /g,'').replace(/\\cdot|\\times/g,'*').replace(/\\pi/g,'pi').replace(/\\(sin|cos|tan|ln|sqrt|abs)/g,'$1');let m;
while((m=s.indexOf('\\frac'))>=0){const a=grp(s,m+5),b=grp(s,a.e);s=s.slice(0,m)+'(('+a.t+')/('+b.t+'))'+s.slice(b.e)}return s.replace(/\{/g,'(').replace(/\}/g,')')}
function P(src){const t=src.match(/sqrt|sin|cos|tan|ln|abs|pi|\d+\.?\d*|[a-z]|[-+*/^()=]/gi)||[];let i=0;const F=/^(sqrt|sin|cos|tan|ln|abs)$/;
const ex=()=>{let a=tm();while(t[i]==='+'||t[i]==='-'){const o=t[i++];a=[o,a,tm()]}return a};
const tm=()=>{let a=un();for(;;){const c=t[i];if(c==='*'||c==='/'){i++;a=[c,a,un()]}else if(c&&/^[\d.a-z(]/i.test(c))a=['*',a,un()];else return a}};
const un=()=>{if(t[i]==='-'){i++;return['neg',un()]}if(t[i]==='+'){i++;return un()}const a=at();if(t[i]==='^'){i++;return['^',a,un()]}return a};
const at=()=>{const c=t[i++];if(c==null)throw 0;if(c==='('){const a=ex();if(t[i++]!==')')throw 0;return a}if(/^\d/.test(c))return['n',+c];if(F.test(c))return['f',c,at()];if(c==='pi')return['n',Math.PI];if(/^[a-z]$/i.test(c))return['v',c];throw 0};
const a=ex();if(t[i]==='='){i++;const r=['=',a,ex()];if(i<t.length)throw 0;return r}if(i<t.length)throw 0;return a}
function ev(n,e){switch(n[0]){case'n':return n[1];case'v':{const v=e[n[1]];if(v==null)throw 0;return v}case'neg':return-ev(n[1],e);case'f':return Math[n[1]==='ln'?'log':n[1]](ev(n[2],e));default:{const a=ev(n[1],e),b=ev(n[2],e);return n[0]==='+'?a+b:n[0]==='-'?a-b:n[0]==='*'?a*b:n[0]==='/'?a/b:Math.pow(a,b)}}}
function rts(a,env={},R=30){const f=x=>{try{return ev(a[1],{...env,x})-ev(a[2],{...env,x})}catch(e){return NaN}};const o=[];let p=f(-R),x0=-R;
for(let x=-R+.01;x<=R;x+=.01){const c=f(x);if(isFinite(p)&&isFinite(c)&&(p===0||p*c<0)){let l=x0,h=x;for(let k=0;k<50;k++){const m=(l+h)/2;f(l)*f(m)<=0?h=m:l=m}const r=+((l+h)/2).toFixed(5);if(!o.length||Math.abs(o[o.length-1]-r)>1e-3)o.push(r)}p=c;x0=x}return o}
function sm(a,b,env={}){const vs=new Set(['x']),w=n=>{if(n[0]==='v'){if(!(n[1] in env))vs.add(n[1])}else if(n[0]==='f')w(n[2]);else if(n[0]!=='n'){w(n[1]);if(n[2])w(n[2])}};w(a);w(b);for(let i=0;i<10;i++){const e={...env};for(const k of vs)e[k]=Math.random()*6-3;let u,v;try{u=ev(a,e);v=ev(b,e)}catch(_){return false}if(isFinite(u)&&isFinite(v)&&Math.abs(u-v)>1e-6*(1+Math.abs(u)))return false}return true}
function ln(n){switch(n[0]){case'n':return Number.isInteger(n[1])?'('+n[1]+':ℝ)':String(n[1]);case'v':return n[1];case'neg':return'(-'+ln(n[1])+')';case'f':return(n[1]==='sqrt'?'Real.sqrt':'Real.'+(n[1]==='ln'?'log':n[1]))+' '+ln(n[2]);case'=':return ln(n[1])+' = '+ln(n[2]);case'^':return'('+ln(n[1])+' ^ '+(n[2][0]==='n'&&Number.isInteger(n[2][1])?n[2][1]:ln(n[2]))+')';default:return'('+ln(n[1])+' '+n[0]+' '+ln(n[2])+')'}}

/* ---------- exercises ---------- */
const ri=v=>v[0]+Math.floor(Math.random()*(v[1]-v[0]+1));
function mk(ex){const env={};for(const[k,v]of Object.entries(ex.vars||{}))env[k]=Array.isArray(v)?ri(v):ev(P(lx(v)),env);
const fill=s=>String(s).replace(/\{(\+?)(\w+)\}/g,(_,p,n)=>{const v=env[n];return p?(v<0?'-'+-v:'+'+v):v});
return{ex,env,q:fill(ex.text),eq:fill(ex.eq||ex.expr),rhs:ex.rhs==null?undefined:fill(ex.rhs),fill,ans:Array.isArray(ex.ans)?ex.ans.map(a=>ev(P(lx(a)),env)):ex.ans}}
function rootForm(a){if(a[0]==='='&&a[1][0]==='v'&&a[1][1]==='x'){try{return ev(a[2],{})}catch(e){}}return null}

function mv(prev,a,env){const A=prev[1],B=prev[2],T=a[1],U=a[2];
if(sm(T,A,env)&&sm(U,B,env))return'rw';
if(sm(['-',T,A],['-',U,B],env))return'add';
for(const x0 of[1.3,-.7,2.1,.4,-2.6]){let a0,t0;try{a0=ev(A,{...env,x:x0});t0=ev(T,{...env,x:x0})}catch(e){return null}
if(Math.abs(a0)>1e-6){const k=t0/a0;if(isFinite(k)&&Math.abs(k)>1e-9&&sm(T,['*',['n',k],A],env)&&sm(U,['*',['n',k],B],env))return'mul';break}}

if(!L.length)return{ok:false,m:t('c.empty'),L};
if(I.ex.type==='prove'){const rl=I.rules||[],used=[];let prev=P(lx(I.eq)),goal=P(lx(I.rhs));
for(let i=0;i<L.length;i++){let a;try{a=P(lx(L[i]))}catch(e){return{ok:false,s:i,L,m:t('c.parse',i+1)}}

const SERVER_PY=String.raw`#!/usr/bin/env python3
"""Local Lean checker for Burhan.  Run:  python3 server.py
Env: HOST (127.0.0.1) · LEAN_JOBS (2) · PORT (8765) · LEAN_PROJECT (~/lean-check, a Lake project with Mathlib) · LEAN_TIMEOUT (120) · ALLOW_ORIGIN (*)"""
import json, os, re, shutil, subprocess, tempfile, threading
from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

HOST = os.environ.get("HOST", "127.0.0.1")
PORT = int(os.environ.get("PORT", "8765"))
JOBS = threading.Semaphore(int(os.environ.get("LEAN_JOBS", "2")))
PROJECT = os.path.expanduser(os.environ.get("LEAN_PROJECT", "~/lean-check"))
TIMEOUT = int(os.environ.get("LEAN_TIMEOUT", "120"))
ORIGIN = os.environ.get("ALLOW_ORIGIN", "*")
MAX_LEN = 4000
# Any web page can reach localhost, and Lean can run code: accept only a plain example ... := by ....
BAD = re.compile(
    r"\b(import|open|run_cmd|run_tac|run_elab|elab|macro|macro_rules|syntax|notation|infix|infixl|infixr|prefix|postfix"
    r"|initialize|unsafe|implemented_by|extern|attribute|set_option|namespace|section|end|local|scoped|instance|class"
    r"|structure|inductive|def|theorem|lemma|abbrev|opaque|axiom|mutual|variable|universe|export|private|protected"
    r"|deriving|IO|System|Lean|Meta|Elab|Tactic|Mathlib)\b|#\w+|@\[|[«»]"
)

def clean(code):
    code = re.sub(r"/-.*?-/", " ", code, flags=re.S)
    return re.sub(r"--[^\n]*", "", code).strip()

class H(BaseHTTPRequestHandler):
    def log_message(self, *a): pass
    def _cors(self):
        self.send_header("Access-Control-Allow-Origin", ORIGIN)
        self.send_header("Access-Control-Allow-Methods", "GET, POST, OPTIONS")
        self.send_header("Access-Control-Allow-Headers", "Content-Type")
        self.send_header("Access-Control-Allow-Private-Network", "true")
    def _json(self, code, obj):
        b = json.dumps(obj, ensure_ascii=False).encode()
        self.send_response(code); self._cors()
        self.send_header("Content-Type", "application/json; charset=utf-8")
        self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    def do_OPTIONS(self):
        self.send_response(204); self._cors(); self.end_headers()
    def do_GET(self):
        self._json(200, {"ok": True, "service": "burhan-lean", "lake": shutil.which("lake") is not None, "project": os.path.isdir(PROJECT)})
    def do_POST(self):
        try:
            n = int(self.headers.get("Content-Length", 0))
            code = clean(json.loads(self.rfile.read(n))["code"])
        except Exception:
            return self._json(400, {"ok": False, "msg": "bad request"})
        if not code or len(code) > MAX_LEN: return self._json(413, {"ok": False, "msg": "empty or too long"})
        if not re.match(r"example\b", code) or BAD.search(code):
            return self._json(200, {"ok": False, "msg": "rejected: only a plain example … := by … is accepted"})
        if not os.path.isdir(PROJECT): return self._json(200, {"ok": False, "msg": "LEAN_PROJECT not found: " + PROJECT})
        if not JOBS.acquire(timeout=20): return self._json(200, {"ok": False, "msg": "busy, try again"})
        with tempfile.NamedTemporaryFile("w", suffix=".lean", dir=PROJECT, delete=False, encoding="utf-8") as f:
            f.write("import Mathlib\n\n" + code + "\n"); path = f.name
        try:
            r = subprocess.run(["lake", "env", "lean", path], cwd=PROJECT, capture_output=True, text=True, timeout=TIMEOUT)
            out = (r.stdout + r.stderr).replace(path, "code").strip()
            ok = r.returncode == 0 and "sorry" not in out and not re.search(r"\bsorry\b", code)
            errs = [{"line": int(m.group(1)) - 2, "msg": m.group(3)} for m in re.finditer(r"^code:(\d+):(\d+): error: (.*)$", out, re.M)]
            self._json(200, {"ok": ok, "msg": out[:1500], "errors": errs})
        except subprocess.TimeoutExpired:
            self._json(200, {"ok": False, "msg": "timeout"})
        except FileNotFoundError:
            self._json(200, {"ok": False, "msg": "lake not found: install elan first"})
        finally:
            JOBS.release()
            try: os.remove(path)
            except OSError: pass

if __name__ == "__main__":
    print(f"Burhan Lean server: http://{HOST}:{PORT}  ·  project: {PROJECT}  ·  lake: {shutil.which('lake') or 'NOT FOUND'}")
    ThreadingHTTPServer((HOST, PORT), H).serve_forever()
`;
